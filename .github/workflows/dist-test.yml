
name: Test Distribution

on:
  push:
    branches: [ master ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "rtlsdr/**"
      - "tests/**"
      - ".github/workflows/dist-test.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "rtlsdr/**"
      - "tests/**"
      - ".github/workflows/dist-test.yml"
  workflow_dispatch:
    inputs:
      allow_deploy:
        description: 'Deploy with twine'
        required: true
        type: boolean

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14
      - name: Build dists
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 'dists'
          path: 'dist/*'

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2204, blacksmith-6vcpu-macos-latest, blacksmith-2vcpu-windows-2025 ]
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: 'dists'
        path: dist
    - name: Delete source directories
      shell: bash
      run: |
        rm -Rf rtlsdr
    # Test the built distributions in isolated environments to ensure they're packaged properly
    - name: Test wheel
      shell: bash
      run: uv run --isolated --no-project --with pyrtlsdrlib --with dist/*.whl smoke_test.py
    - name: Test sdist
      shell: bash
      run: uv run --isolated --no-project --with pyrtlsdrlib --with dist/*.tar.gz smoke_test.py

  deploy:
    needs: test
    if: ${{ success() && (github.event.inputs.allow_deploy == 'true') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel twine
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: 'dists'
          path: dist
      - name: Publish to PyPI
        if: ${{ success() && github.event.inputs.allow_deploy == 'true' }}
        env:
          TWINE_REPOSITORY: ${{ secrets.TWINE_REPOSITORY }}
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*
