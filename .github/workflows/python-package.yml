# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "rtlsdr/**"
      - "tests/**"
      - ".github/workflows/python-package.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "rtlsdr/**"
      - "tests/**"
      - ".github/workflows/python-package.yml"
  workflow_dispatch:

jobs:
  test:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [blacksmith-2vcpu-ubuntu-2204, blacksmith-6vcpu-macos-latest, blacksmith-2vcpu-windows-2025]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Project
      run: uv sync --frozen --group test --group doc
    - name: Test with pytest
      shell: bash
      run: |
        uv run pytest --cov-config .coveragerc --cov=rtlsdr
        uv run pytest --cov-append --cov-config .coveragerc --cov=rtlsdr --no-overrides --pyargs tests/no_override_client_mode.py
        uv run pytest --cov-append --cov-config .coveragerc --cov=rtlsdr --no-overrides --pyargs tests/no_override_dll_loader.py
    - name: Generate coverage reports
      run: |
        uv run coverage report
        uv run coverage xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: OS,PYTHON
      env:
        OS: ${{ matrix.os }}
        PYTHON: ${{ matrix.python-version }}
